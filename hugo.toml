baseURL = "https://repairman.example.com/"
languageCode = "en-us"
title = "Luke's Tech"

# The theme uses a `category` taxonomy for navigation between galleries.
[taxonomies]
  category = 'categories'

[params]
  [params.author]
    name = "Luke's Tech"
    description = "Portfolio and gallery of vintage analogue electronics repair and restoration — CRT televisions & monitors and portable cassette players."
  # Warm, technical, nostalgic palette (overrides theme CSS custom properties).
  [params.galleriesdeluxe]
    [params.galleriesdeluxe.cssvars]
      color-background = "#161009"
      color-background-footer = "#1d140b"
      color-primary = "#e0913b"
      color-secondary = "#f0e2c8"
      color-text = "#f0e2c8"
      color-text-footer = "#d9c9a8"
  [params.gallerydeluxe]
    shuffle = false
    reverse = true
    enable_exif = false

[caches]
  [caches.images]
    dir = ':cacheDir/galleriesdeluxe'
    maxAge = "4320h"

[module]
  [[module.imports]]
    path = "github.com/bep/galleriesdeluxe"
